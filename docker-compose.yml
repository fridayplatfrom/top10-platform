# ==============================================================================
# TOP 10 PLATFORM — DOCKER COMPOSE ORCHESTRATION
# App with externally managed MariaDB
# ==============================================================================

version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: top10-web
    restart: unless-stopped
    ports:
      - "${PORT:-3456}:3456"
    environment:
      - NODE_ENV=production
      - PORT=3456
      - BASE_URL=${BASE_URL:-http://localhost:3456}
      - DB_HOST=${DB_HOST:-127.0.0.1}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:?Set DB_USER}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=${DB_NAME:?Set DB_NAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD before starting}
      - EDITORIAL_PUBLISH_KEY=${EDITORIAL_PUBLISH_KEY:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@top10.io}
