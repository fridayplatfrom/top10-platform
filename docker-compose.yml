# ==============================================================================
# TOP 10 PLATFORM — DOCKER COMPOSE ORCHESTRATION
# Complete self-hosted production stack with MongoDB & Auto-Restart
# ==============================================================================

version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: top10-web
    restart: unless-stopped
    ports:
      - "${PORT:-3456}:3456"
    environment:
      - NODE_ENV=production
      - PORT=3456
      - BASE_URL=${BASE_URL:-http://localhost:3456}
      - MONGODB_URI=mongodb://mongo:27017/top10
      - MONGODB_DB_NAME=top10
      - PAYPAL_MODE=${PAYPAL_MODE:-sandbox}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-top10_secret_production_key}
    volumes:
      - top10-app-data:/app/data
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7.0-jammy
    container_name: top10-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=top10
    volumes:
      - top10-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  top10-app-data:
    driver: local
  top10-mongo-data:
    driver: local
